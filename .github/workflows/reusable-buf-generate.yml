name: Buf generate

on:
  workflow_call:

jobs:
  buf-generate:
    name: No diff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Both checkouts use an explicit `path` (rather than the default
      # $GITHUB_WORKSPACE root) so minerva-protocol lands as a sibling of
      # minerva-server, matching buf.gen.yaml's `../minerva-protocol` input.
      # actions/checkout refuses a `path` that escapes $GITHUB_WORKSPACE, so
      # this can't be done by checking minerva-server out to the workspace
      # root and minerva-protocol to `../minerva-protocol`.
      - name: Checkout minerva-server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: minerva-server
          persist-credentials: false

      # TODO: once minerva-protocol has a commit on the BSR module
      # (buf.build/voron-simulations/minerva), switch buf.gen.yaml's `inputs`
      # to that module:commit ref and drop this checkout + the `directory`
      # input. Until then there is nothing to `buf generate` against in CI
      # other than a real checkout of the protocol repo.
      - name: Checkout minerva-protocol (feat/buf-v1, pending BSR push)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: voron-simulations/minerva-protocol
          ref: feat/buf-v1
          path: minerva-protocol
          persist-credentials: false

      - name: Setup buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0

      - name: Generate
        working-directory: minerva-server
        run: buf generate

      - name: Fail on diff
        working-directory: minerva-server
        run: git diff --exit-code -- src/gen
